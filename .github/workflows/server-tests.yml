name: Server regression

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -X utf8 -m unittest discover -s tests -p "test_onboarding_browser.py" -v

  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-venv
      - run: sudo env BUGGCRAFT_TEST_SYSTEMD=1 python3 -X utf8 -m unittest discover -s tests -p "test_systemd_service.py" -v

  portable-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: windows-x64
          - os: ubuntu-22.04
            package: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python -X utf8 build.py
      - shell: bash
        run: python -X utf8 -m unittest tests.test_portable_package -v
        env:
          BUGGCRAFT_TEST_PACKAGE: ${{ runner.os == 'Windows' && 'dist/buggcraft-node/buggcraft-node.exe' || 'dist/buggcraft-node/buggcraft-node' }}
      - uses: actions/upload-artifact@v4
        with:
          name: buggcraft-node-${{ matrix.package }}
          path: |
            dist/buggcraft-node-${{ matrix.package }}.*
            dist/buggcraft-node/LICENSE
            dist/buggcraft-node/COMMUNITY_LICENSE.md
            dist/buggcraft-node/licenses/**

  publish-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: buggcraft-node-*
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/**
          generate_release_notes: true
